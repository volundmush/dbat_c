[package]
name = "dbat"
version = "0.1.0"
edition = "2021"

[dependencies]
bindgen = "0.71.1"
lazy_static = "1.5"
serde = {version = "1.0", features = ["derive"]}
serde_json = "1.0"
bytes = "1.9"
tracing = "0.1"
tracing-subscriber = "0.3"
clap = {version = "4.5", features = ["derive"]}

[build-dependencies]
cc = { version = "1.2", features = ["parallel"] }
glob = "0.3"
bindgen = "0.71"